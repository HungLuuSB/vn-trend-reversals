name: vnbank
version: "0.1.0"
config-version: 2
profile: vnbank

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: [target, dbt_packages]

flags:
  send_anonymous_usage_stats: false

vars:
  # The exact raw-layer objects the models read. Pinned (not "latest") so every build of the
  # research tables is reproducible. Change only together with an entry in research/paper1/DECISIONS.md
  # or docs/feasibility-week1.md explaining why.
  cafef_archives:
    raw: "cafef/2026-11-24/CafeF.SolieuGD.Raw.Upto23112026.c5541a57.zip"
    adjusted: "cafef/2026-11-24/CafeF.SolieuGD.Upto23112026.6dfb0cbf.zip"

models:
  vnbank:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
