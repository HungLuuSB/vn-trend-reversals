version: 2

models:
  - name: int_cafef__raw_adj_pairs
    description: Raw and CafeF-adjusted close/low side by side for kept ordinary-share rows.
  - name: int_corporate_actions
    description: >
      Corporate actions inferred from jumps in CafeF's adjusted/raw ratio. adj_ratio = previous
      raw close / theoretical ex-date reference price (>1 for dividends, bonus shares, splits).
      Cross-checked against Yahoo in qa_corporate_actions_vs_yahoo.
    columns:
      - name: adj_ratio
        data_tests: [not_null]
      - name: ex_date
        data_tests: [not_null]

unit_tests:
  - name: detects_stock_and_cash_dividends_and_ignores_rounding
    description: >
      Hand-built series as CafeF would publish it (adjusted prices rounded to 0.1 VND):
      a 25% stock dividend on 2024-01-04 (10,000 -> 8,000) and a 500 VND cash dividend on
      2024-01-08 (8,100 -> 7,600). 2024-01-05 carries only rounding noise and must not count.
      BBB has no events at all.
    model: int_corporate_actions
    given:
      - input: ref('int_cafef__raw_adj_pairs')
        rows:
          - {ticker: AAA, trade_date: 2024-01-02, exchange: HSX, raw_close: 10000, raw_low: 10000, adj_close: 7506.2, adj_low: 7506.2}
          - {ticker: AAA, trade_date: 2024-01-03, exchange: HSX, raw_close: 10000, raw_low: 10000, adj_close: 7506.2, adj_low: 7506.2}
          - {ticker: AAA, trade_date: 2024-01-04, exchange: HSX, raw_close: 8000, raw_low: 8000, adj_close: 7506.2, adj_low: 7506.2}
          - {ticker: AAA, trade_date: 2024-01-05, exchange: HSX, raw_close: 8100, raw_low: 8100, adj_close: 7600.0, adj_low: 7600.0}
          - {ticker: AAA, trade_date: 2024-01-08, exchange: HSX, raw_close: 7600, raw_low: 7600, adj_close: 7600.0, adj_low: 7600.0}
          - {ticker: BBB, trade_date: 2024-01-02, exchange: HNX, raw_close: 5000, raw_low: 5000, adj_close: 5000, adj_low: 5000}
          - {ticker: BBB, trade_date: 2024-01-03, exchange: HNX, raw_close: 5100, raw_low: 5100, adj_close: 5100, adj_low: 5100}
    expect:
      rows:
        - {ticker: AAA, ex_date: 2024-01-04, prev_trade_date: 2024-01-03, low_close_agree: true}
        - {ticker: AAA, ex_date: 2024-01-08, prev_trade_date: 2024-01-05, low_close_agree: true}
