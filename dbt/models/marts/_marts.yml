version: 2

models:
  - name: prices_daily_raw
    description: >
      Clean raw (unadjusted) daily prices of ordinary shares on HOSE, HNX and UPCoM from the
      pinned CafeF raw archive. One row per ticker and trading date. Covers all available
      history; the study period (research/DECISIONS.md D-001) is applied when the research
      snapshot is built, not here.
    config:
      contract:
        enforced: true
    columns:
      - name: ticker
        data_type: String
        data_tests: [not_null]
      - name: trade_date
        data_type: Date
        data_tests: [not_null]
      - name: exchange
        data_type: LowCardinality(String)
        data_tests:
          - accepted_values:
              arguments:
                values: [HSX, HNX, UPCOM]
      - name: open_vnd
        data_type: Float64
      - name: high_vnd
        data_type: Float64
      - name: low_vnd
        data_type: Float64
      - name: close_vnd
        data_type: Float64
      - name: volume
        data_type: Int64
      - name: ohlc_outside_range
        data_type: Bool
        description: Open or close lies outside low..high (research/DECISIONS.md D-002).
        data_tests: [not_null]
      - name: available_at_utc
        data_type: DateTime64(3, 'UTC')
        data_tests: [not_null]
      - name: raw_key
        data_type: LowCardinality(String)
        data_tests: [not_null]
      - name: raw_sha256
        data_type: LowCardinality(String)
      - name: source_file
        data_type: LowCardinality(String)
      - name: row_num
        data_type: UInt32

  - name: qa_cafef_rejects
    description: Quarantined rows with the check they failed. Reviewed, never silently deleted.
    columns:
      - name: reject_reason
        data_tests: [not_null]

  - name: qa_cafef_summary
    description: Row counts by variant, instrument type, outcome and reason.

  - name: prices_daily_adjusted
    description: >
      Our back-adjusted prices: raw / product of adj_ratio of all later corporate actions.
      Use for returns and scale-free ratios only; price levels come from prices_daily_raw
      (look-ahead: levels are rescaled by future events).
    columns:
      - name: adj_factor
        data_tests: [not_null]
      - name: close_adj
        data_tests: [not_null]

  - name: qa_corporate_actions_vs_yahoo
    description: >
      Our inferred corporate actions vs Yahoo events (validation sample, study period, Yahoo
      coverage). status = match, date_shift, ratio_mismatch, yahoo_only or ours_only.
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [match, date_shift, ratio_mismatch, yahoo_only, ours_only]

unit_tests:
  - name: back_adjusts_only_by_later_events
    description: >
      A 2:1 split on 2024-01-04 and a 25% stock dividend on 2024-01-08. Prices before an event
      are divided by its ratio; the last price stays raw; an event's own day is not divided by it.
    model: prices_daily_adjusted
    given:
      - input: ref('prices_daily_raw')
        rows:
          - {ticker: AAA, trade_date: 2024-01-03, exchange: HSX, open_vnd: 20000, high_vnd: 20000, low_vnd: 20000, close_vnd: 20000, volume: 100, ohlc_outside_range: false}
          - {ticker: AAA, trade_date: 2024-01-04, exchange: HSX, open_vnd: 10000, high_vnd: 10000, low_vnd: 10000, close_vnd: 10000, volume: 100, ohlc_outside_range: false}
          - {ticker: AAA, trade_date: 2024-01-05, exchange: HSX, open_vnd: 10000, high_vnd: 10000, low_vnd: 10000, close_vnd: 10000, volume: 100, ohlc_outside_range: false}
          - {ticker: AAA, trade_date: 2024-01-08, exchange: HSX, open_vnd: 8000, high_vnd: 8000, low_vnd: 8000, close_vnd: 8000, volume: 100, ohlc_outside_range: false}
      - input: ref('int_corporate_actions')
        rows:
          - {ticker: AAA, ex_date: 2024-01-04, adj_ratio: 2.0}
          - {ticker: AAA, ex_date: 2024-01-08, adj_ratio: 1.25}
    expect:
      rows:
        - {ticker: AAA, trade_date: 2024-01-03, adj_factor: 0.4, close_adj: 8000, close_raw: 20000}
        - {ticker: AAA, trade_date: 2024-01-04, adj_factor: 0.8, close_adj: 8000, close_raw: 10000}
        - {ticker: AAA, trade_date: 2024-01-05, adj_factor: 0.8, close_adj: 8000, close_raw: 10000}
        - {ticker: AAA, trade_date: 2024-01-08, adj_factor: 1.0, close_adj: 8000, close_raw: 8000}
