version: 2

sources:
  - name: cafef
    schema: "{{ env_var('CLICKHOUSE_DB', 'vnbank') }}"
    description: >
      CafeF end-of-day archives loaded unchanged from the raw layer by
      ingestion/market/cafef_load.py (ADR 0002). One partition per raw object.
    tables:
      - name: raw_cafef_eod
        columns:
          - name: raw_key
            data_tests: [not_null]
          - name: raw_sha256
            data_tests: [not_null]
          - name: variant
            data_tests:
              - accepted_values:
                  arguments:
                    values: [raw, adjusted]
          - name: exchange
            data_tests:
              - accepted_values:
                  arguments:
                    values: [HSX, HNX, UPCOM]
          - name: trade_date
            data_tests: [not_null]

  - name: yahoo
    schema: "{{ env_var('CLICKHOUSE_DB', 'vnbank') }}"
    description: >
      Yahoo Finance dividend/split events for a validation sample of HOSE symbols, loaded from
      the raw layer by ingestion/market/yahoo_ingest.py. Used only to cross-check corporate
      actions inferred from CafeF; never model input.
    tables:
      - name: raw_yahoo_events
        columns:
          - name: ticker
            data_tests: [not_null]
          - name: event_type
            data_tests:
              - accepted_values:
                  arguments:
                    values: [split, dividend, none]

  - name: cafef_history
    schema: "{{ env_var('CLICKHOUSE_DB', 'vnbank') }}"
    description: >
      CafeF per-ticker price history fetched for documented gaps, UPCoM VWAP references and
      overlap checks (ingestion/market/cafef_history_ingest.py, FETCH_PLAN).
    tables:
      - name: raw_cafef_history
        columns:
          - name: ticker
            data_tests: [not_null]
          - name: trade_date
            data_tests: [not_null]

  - name: global
    schema: "{{ env_var('CLICKHOUSE_DB', 'vnbank') }}"
    description: >
      Global series for feature block D (D-009), loaded from the raw layer by
      ingestion/global_markets/ingest.py. What each symbol is, and when it became public, is
      defined in seed global_series.
    tables:
      - name: raw_global_obs
        columns:
          - name: symbol
            data_tests: [not_null]
          - name: obs_date
            data_tests: [not_null]
