version: 2

sources:
  - name: cafef
    schema: "{{ env_var('CLICKHOUSE_DB', 'vnbank') }}"
    description: >
      CafeF end-of-day archives loaded unchanged from the raw layer by
      ingestion/market/cafef_load.py (ADR 0002). One partition per raw object.
    tables:
      - name: raw_cafef_eod
        columns:
          - name: raw_key
            data_tests: [not_null]
          - name: raw_sha256
            data_tests: [not_null]
          - name: variant
            data_tests:
              - accepted_values:
                  arguments:
                    values: [raw, adjusted]
          - name: exchange
            data_tests:
              - accepted_values:
                  arguments:
                    values: [HSX, HNX, UPCOM]
          - name: trade_date
            data_tests: [not_null]

  - name: yahoo
    schema: "{{ env_var('CLICKHOUSE_DB', 'vnbank') }}"
    description: >
      Yahoo Finance dividend/split events for a validation sample of HOSE symbols, loaded from
      the raw layer by ingestion/market/yahoo_ingest.py. Used only to cross-check corporate
      actions inferred from CafeF; never model input.
    tables:
      - name: raw_yahoo_events
        columns:
          - name: ticker
            data_tests: [not_null]
          - name: event_type
            data_tests:
              - accepted_values:
                  arguments:
                    values: [split, dividend, none]
