# No secrets here: credentials come from environment variables.
# Run from dbt/:  uv run --env-file ../.env dbt build
vnbank:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'vnbank') }}"
      secure: false
      threads: 1  # sequential: heavy models share ClickHouse's 3 GB container limit
      send_receive_timeout: 600
      custom_settings:
        session_timezone: UTC
