version: 2

seeds:
  - name: price_limit_schedule
    description: >
      Daily price limits (fraction of the reference price) per exchange and regime, with the
      legal basis, source and confidence of every row (research/paper1/DECISIONS.md D-003).
      Regimes: normal; resumption (first session after a long suspension). New listings and
      exchange transfers have no reconstructable reference price and are not listed.
    config:
      column_types:
        exchange: LowCardinality(String)
        regime: LowCardinality(String)
        limit_pct: Float64
        valid_from: Date
        valid_to: Date
        legal_basis: String
        source_url: String
        confidence: LowCardinality(String)
  - name: tick_size_schedule
    description: Tick size by exchange, period and price band [price_from, price_to) in VND.
    config:
      column_types:
        exchange: LowCardinality(String)
        valid_from: Date
        valid_to: Date
        price_from: Float64
        price_to: Float64
        tick_vnd: Float64
        legal_basis: String
        source_url: String
        confidence: LowCardinality(String)
  - name: reference_price_rule
    description: >
      How each exchange set the reference price. Only prev_close can be rebuilt from CafeF
      data; vwap_* methods need traded value, which CafeF does not publish.
    config:
      column_types:
        exchange: LowCardinality(String)
        valid_from: Date
        valid_to: Date
        method: LowCardinality(String)
        legal_basis: String
        source_url: String
        confidence: LowCardinality(String)

  - name: vn30_changes
    description: >
      VN30 basket changes: initial basket at launch, then additions and removals at each
      periodic review and ad-hoc replacement. effective_date = first trading day the change
      applies. Compiled from HOSE announcements and press; one source per row.
    config:
      column_types:
        effective_date: Date
        announcement_date: Nullable(Date)
        ticker: LowCardinality(String)
        action: LowCardinality(String)
        review: LowCardinality(String)
        source_url: String
        confidence: LowCardinality(String)
  - name: vn30_baskets
    description: Full 30-stock baskets as printed in a source, used to cross-check vn30_changes.
    config:
      column_types:
        effective_date: Date
        ticker: LowCardinality(String)
        source_url: String
        confidence: LowCardinality(String)
  - name: bank_spells
    description: >
      Every commercial bank listed or registered on HOSE, HNX or UPCoM at any time in the
      study period, one row per exchange spell (including delisted and merged banks).
    config:
      column_types:
        ticker: LowCardinality(String)
        bank_name_en: String
        bank_name_vi: String
        exchange: LowCardinality(String)
        first_trade_date: Date
        last_trade_date: Nullable(Date)
        end_reason: String
        source_url: String
        confidence: LowCardinality(String)
  - name: known_price_gaps
    description: >
      Documented holes in the CafeF bulk price history for universe stocks, with the reason and
      the check that found them. Tests exclude only these; any new gap still fails.
    config:
      column_types:
        ticker: LowCardinality(String)
        gap_from: Date
        gap_to: Date
        exchange: LowCardinality(String)
        reason: String
        found_by: String
  - name: corporate_action_adjudications
    description: >
      Verified facts for disputed or implausible corporate actions in the universe
      (research/paper1/DECISIONS.md D-007): one row per component (cash, stock, rights) of an event,
      with source and confidence. queue_date links back to the disputed event.
    config:
      column_types:
        ticker: LowCardinality(String)
        queue_date: Date
        ex_date: Nullable(Date)
        record_date: Nullable(Date)
        cash_vnd: Float64
        stock_ratio: Float64
        rights_ratio: Float64
        rights_price_vnd: Float64
        verdict: LowCardinality(String)
        source_url: String
        confidence: LowCardinality(String)
        notes: String
  - name: global_series
    description: >
      Global overnight series of feature block D (docs/proposals/paper1-trend-reversals.md, research/paper1/DECISIONS.md
      D-009): source, symbol and the rule that sets each value's available_at_utc. Read by
      both ingestion (what to fetch) and dbt (when each value became public).
    config:
      column_types:
        series_id: LowCardinality(String)
        source: LowCardinality(String)
        symbol: String
        description: String
        kind: LowCardinality(String)
        availability_rule: LowCardinality(String)
        close_time_local: String
        close_tz: LowCardinality(String)
        proposal_ref: String
        note: String
        confidence: LowCardinality(String)
  - name: settlement_cycle
    description: >
      Equity settlement cycle in force for each trade date (research/paper1/DECISIONS.md D-021):
      T+3 until trades of 2015-12-31, T+2 from trades of 2016-01-04. Read by the trading test
      (earliest sell = open of the session after the settlement day).
    config:
      column_types:
        valid_from: Date
        valid_to: Date
        cycle_days: UInt8
        settlement_note: String
        source_url: String
        confidence: LowCardinality(String)
    columns:
      - name: valid_from
        data_tests: [not_null, unique]
      - name: cycle_days
        data_tests: [not_null]
      - name: source_url
        data_tests: [not_null]
  - name: bank_aliases
    description: >
      Names used to count news mentions of each bank (research/paper1/DECISIONS.md D-023):
      the ticker (matched as a whole word, case-sensitive), the short names and former names
      in bank_spells.bank_name_en, the full Vietnamese name and "Ngân hàng <name>". Every alias
      comes from bank_spells.csv, which carries the sources. `ambiguous` marks aliases that are
      also ordinary words (counts are reported with and without them).
    config:
      column_types:
        ticker: LowCardinality(String)
        alias: String
        kind: LowCardinality(String)
        ambiguous: Bool
        source: String
    columns:
      - name: ticker
        data_tests: [not_null]
      - name: alias
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]
