version: 2

seeds:
  - name: price_limit_schedule
    description: >
      Daily price limits (fraction of the reference price) per exchange and regime, with the
      legal basis, source and confidence of every row (research/DECISIONS.md D-003).
      Regimes: normal; resumption (first session after a long suspension). New listings and
      exchange transfers have no reconstructable reference price and are not listed.
    config:
      column_types:
        exchange: LowCardinality(String)
        regime: LowCardinality(String)
        limit_pct: Float64
        valid_from: Date
        valid_to: Date
        legal_basis: String
        source_url: String
        confidence: LowCardinality(String)
  - name: tick_size_schedule
    description: Tick size by exchange, period and price band [price_from, price_to) in VND.
    config:
      column_types:
        exchange: LowCardinality(String)
        valid_from: Date
        valid_to: Date
        price_from: Float64
        price_to: Float64
        tick_vnd: Float64
        legal_basis: String
        source_url: String
        confidence: LowCardinality(String)
  - name: reference_price_rule
    description: >
      How each exchange set the reference price. Only prev_close can be rebuilt from CafeF
      data; vwap_* methods need traded value, which CafeF does not publish.
    config:
      column_types:
        exchange: LowCardinality(String)
        valid_from: Date
        valid_to: Date
        method: LowCardinality(String)
        legal_basis: String
        source_url: String
        confidence: LowCardinality(String)

  - name: vn30_changes
    description: >
      VN30 basket changes: initial basket at launch, then additions and removals at each
      periodic review and ad-hoc replacement. effective_date = first trading day the change
      applies. Compiled from HOSE announcements and press; one source per row.
    config:
      column_types:
        effective_date: Date
        announcement_date: Nullable(Date)
        ticker: LowCardinality(String)
        action: LowCardinality(String)
        review: LowCardinality(String)
        source_url: String
        confidence: LowCardinality(String)
  - name: vn30_baskets
    description: Full 30-stock baskets as printed in a source, used to cross-check vn30_changes.
    config:
      column_types:
        effective_date: Date
        ticker: LowCardinality(String)
        source_url: String
        confidence: LowCardinality(String)
  - name: bank_spells
    description: >
      Every commercial bank listed or registered on HOSE, HNX or UPCoM at any time in the
      study period, one row per exchange spell (including delisted and merged banks).
    config:
      column_types:
        ticker: LowCardinality(String)
        bank_name_en: String
        bank_name_vi: String
        exchange: LowCardinality(String)
        first_trade_date: Date
        last_trade_date: Nullable(Date)
        end_reason: String
        source_url: String
        confidence: LowCardinality(String)
  - name: known_price_gaps
    description: >
      Documented holes in the CafeF bulk price history for universe stocks, with the reason and
      the check that found them. Tests exclude only these; any new gap still fails.
    config:
      column_types:
        ticker: LowCardinality(String)
        gap_from: Date
        gap_to: Date
        exchange: LowCardinality(String)
        reason: String
        found_by: String
