[project]
name = "vn-bank-data-platform"
version = "0.1.0"
description = "Point-in-time data for Vietnamese banks and VN30, and the trend-reversal survival-analysis paper"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "network: test calls an external service (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "PD", "NPY"]
# DTZ: flag naive datetimes (all timestamps must be timezone-aware; see CLAUDE.md).
