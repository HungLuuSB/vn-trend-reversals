[project]
name = "vn-bank-data-platform"
version = "0.1.0"
description = "Point-in-time data for Vietnamese banks and VN30, and research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.44.0",
    "clickhouse-connect==1.12.0",
    "dbt-clickhouse==1.10.3",
    "dbt-core==1.11.17",
    "httpx==0.28.1",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pyyaml==6.0.4",
    "scikit-learn==1.9.1",
    "scikit-survival==0.28.0",
    "scipy==1.18.1",  # imported directly (deflated Sharpe ratio); already locked via scikit-learn
    "vnstock==6.0.1",
    "vnstock-oapi==0.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
# uv's own build backend: makes src/vnbank an installable package (CLAUDE.md, Repo layout)
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vnbank"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests share small hand-built fixtures via tests.*
addopts = "-ra --strict-markers"
markers = [
    "network: test calls an external service (deselect with -m 'not network')",
    "integration: test needs the local research stack (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "PD", "NPY"]
ignore = ["PD009"]  # .iat is a fine scalar accessor
# DTZ: flag naive datetimes (all timestamps must be timezone-aware; see CLAUDE.md).

# vnstock generation 6 is distributed only from its own PEP 503 index.
# explicit = true: only the packages mapped below may come from it; everything else stays on PyPI.
[[tool.uv.index]]
name = "vnstock"
url = "https://vnstocks.com/api/packages"
explicit = true

[tool.uv.sources]
vnstock = { index = "vnstock" }
vnstock-oapi = { index = "vnstock" }
